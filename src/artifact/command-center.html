<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · genre: modern-minimal · macrostructure: tabbed app (adapted, no hero/CTA/footer)
 * theme: custom (CaptivateIQ brand DNA) · tabs: BoB / Calendar / To Dos
 * source of truth for this CSS: docs/design/tokens.css in this repo */
:root {
  --color-paper: oklch(97% 0.006 85); --color-paper-2: oklch(94.5% 0.007 85);
  --color-ink: oklch(21% 0.03 258); --color-ink-2: oklch(32% 0.022 258);
  --color-muted: oklch(55% 0.014 250); --color-rule: oklch(85% 0.006 85);
  --color-rule-2: oklch(76% 0.008 85); --color-accent: oklch(55% 0.14 225);
  --color-accent-ink: oklch(98% 0.01 225); --color-graphite: oklch(21% 0.03 258);
  --color-graphite-ink: oklch(93% 0.008 85); --color-graphite-muted: oklch(64% 0.014 250);
  --color-warn: oklch(62% 0.11 55); --color-good: oklch(58% 0.10 150);
  --font-display: "Poppins", ui-sans-serif, system-ui, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --text-xs: 0.6875rem; --text-sm: 0.8125rem; --text-base: 0.9375rem;
  --text-md: 1.125rem; --text-lg: 1.375rem; --text-xl: 1.75rem;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 20px;
  --space-lg: 32px; --space-xl: 48px;
  --radius-sm: 6px; --radius-md: 10px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-base); line-height: 1.5; }
a { color: var(--color-accent); }
.mono-label { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-muted); }
.tabular { font-variant-numeric: tabular-nums; }
.statusbar { background: var(--color-graphite); color: var(--color-graphite-ink); display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); padding: var(--space-sm) var(--space-lg); flex-wrap: wrap; }
.statusbar .wordmark { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); display: flex; align-items: center; gap: var(--space-xs); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; }
.statusbar .syncs { display: flex; gap: var(--space-md); flex-wrap: wrap; }
.sync-chip { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-graphite-muted); display: flex; gap: var(--space-2xs); }
.sync-chip b { color: var(--color-graphite-ink); font-weight: 500; }
.tabstrip { display: flex; gap: var(--space-lg); padding: 0 var(--space-lg); border-bottom: 1px solid var(--color-rule); background: var(--color-paper); }
.tab { font-family: var(--font-body); font-weight: 600; font-size: var(--text-sm); color: var(--color-muted); background: none; border: none; padding: var(--space-sm) var(--space-2xs); cursor: pointer; position: relative; transition: color .15s var(--ease-out); }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; transition: background .15s var(--ease-out); }
.tab:hover { color: var(--color-ink-2); }
.tab:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.tab[aria-selected="true"] { color: var(--color-ink); }
.tab[aria-selected="true"]::after { background: var(--color-accent); }
.shell { max-width: 1360px; margin: 0 auto; padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-lg); }
.tabpanel { display: none; flex-direction: column; gap: var(--space-lg); }
.tabpanel.is-active { display: flex; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-sm); }
.kpi { border: 1px solid var(--color-rule); border-radius: var(--radius-md); padding: var(--space-md); background: var(--color-paper); }
.kpi .mono-label { display: block; margin-bottom: var(--space-2xs); }
.kpi .value { font-family: var(--font-body); font-weight: 600; font-size: var(--text-xl); color: var(--color-ink); }
.panel { border: 1px solid var(--color-rule); border-radius: var(--radius-md); overflow: hidden; background: var(--color-paper); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-rule); }
.panel-head h2 { font-family: var(--font-body); font-weight: 600; font-size: var(--text-md); color: var(--color-ink); margin: 0; }
.refresh-btn { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-ink-2); background: transparent; border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; transition: border-color .15s var(--ease-out), color .15s var(--ease-out); }
.refresh-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
.refresh-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.refresh-btn:active { transform: translateY(1px); }
.bob-table-wrap { max-height: 70vh; overflow: auto; }
.bob-table { width: 100%; border-collapse: collapse; }
.bob-table thead th { position: sticky; top: 0; font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); text-align: left; font-weight: 500; padding: var(--space-xs) var(--space-md); border-bottom: 1px solid var(--color-rule); background: var(--color-paper-2); }
.bob-table tbody td { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-rule); font-size: var(--text-sm); white-space: nowrap; }
.bob-table tbody tr:last-child td { border-bottom: none; }
.bob-table tbody tr:hover { background: var(--color-paper-2); }
.account-name { font-weight: 600; color: var(--color-ink); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: var(--radius-sm); border: 1px solid var(--color-rule-2); color: var(--color-ink-2); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-muted); }
.chip.is-thriving::before { background: var(--color-good); }
.chip.is-watching::before, .chip.is-declining::before { background: var(--color-warn); }
.week-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-sm); }
.day-col { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper); display: flex; flex-direction: column; min-width: 0; }
.day-head { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-muted); padding: var(--space-sm) var(--space-sm) var(--space-xs); border-bottom: 1px solid var(--color-rule); }
.day-head b { color: var(--color-ink); font-weight: 600; }
.meeting-card { padding: var(--space-sm); border-bottom: 1px solid var(--color-rule); }
.day-col .meeting-card:last-child { border-bottom: none; }
.meeting-meta { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-accent); margin-bottom: var(--space-2xs); }
.meeting-brief { font-size: var(--text-sm); color: var(--color-ink-2); line-height: 1.5; margin: 0 0 var(--space-xs); }
.note-field { font-family: var(--font-body); font-size: var(--text-sm); color: var(--color-muted); border: 1px dashed var(--color-rule-2); border-radius: var(--radius-sm); padding: var(--space-2xs) var(--space-xs); cursor: text; transition: border-color .15s var(--ease-out); }
.note-field:hover { border-color: var(--color-accent); color: var(--color-ink-2); }
.note-field:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-style: solid; }
.day-empty { padding: var(--space-sm); font-size: var(--text-sm); color: var(--color-muted); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-sm); }
.kanban-col { border: 1px solid var(--color-rule); border-radius: var(--radius-md); background: var(--color-paper); min-width: 0; }
.kanban-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-rule); font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted); }
.kanban-head .count { color: var(--color-ink); font-weight: 600; }
.kanban-col.is-overdue .kanban-head { color: var(--color-warn); }
.kanban-card { margin: var(--space-sm); padding: var(--space-sm); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); background: var(--color-paper-2); }
.kanban-card .todo-text { display: block; font-size: var(--text-sm); color: var(--color-ink-2); margin-bottom: var(--space-xs); }
.kanban-card.is-done .todo-text { color: var(--color-muted); text-decoration: line-through; }
.badge { font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: var(--radius-sm); border: 1px solid var(--color-rule-2); color: var(--color-muted); }
.empty-note { padding: var(--space-md); font-size: var(--text-sm); color: var(--color-muted); }
@media (max-width: 900px) { .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .statusbar { flex-direction: column; align-items: flex-start; } .week-grid, .kanban { grid-template-columns: 1fr; } .tabstrip { gap: var(--space-md); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="statusbar">
  <div class="wordmark"><span class="live-dot"></span>Command Center</div>
  <div class="syncs" id="syncs"></div>
</div>

<div class="tabstrip" role="tablist" aria-label="Command Center views">
  <button class="tab" role="tab" id="tab-bob" aria-selected="true" aria-controls="panel-bob">Book of Business</button>
  <button class="tab" role="tab" id="tab-cal" aria-selected="false" aria-controls="panel-cal" tabindex="-1">Calendar</button>
  <button class="tab" role="tab" id="tab-todo" aria-selected="false" aria-controls="panel-todo" tabindex="-1">To Dos</button>
</div>

<div class="shell">
  <section class="tabpanel is-active" id="panel-bob" role="tabpanel" aria-labelledby="tab-bob">
    <div class="kpis" id="kpis"></div>
    <section class="panel">
      <div class="panel-head"><h2>Book of Business</h2><button class="refresh-btn" type="button">Refresh</button></div>
      <div class="bob-table-wrap">
        <table class="bob-table">
          <thead><tr><th>Account</th><th>ARR</th><th>Renewal</th><th>Sentiment</th><th>Risk</th></tr></thead>
          <tbody id="bob-rows"></tbody>
        </table>
      </div>
    </section>
  </section>

  <section class="tabpanel" id="panel-cal" role="tabpanel" aria-labelledby="tab-cal" hidden>
    <section class="panel">
      <div class="panel-head"><h2>This Week</h2><button class="refresh-btn" type="button">Refresh</button></div>
      <div style="padding: var(--space-md);"><div class="week-grid" id="week-grid"></div></div>
    </section>
  </section>

  <section class="tabpanel" id="panel-todo" role="tabpanel" aria-labelledby="tab-todo" hidden>
    <section class="panel">
      <div class="panel-head"><h2>To Dos</h2><button class="refresh-btn" type="button">Refresh</button></div>
      <div style="padding: var(--space-md);"><div class="kanban" id="kanban"></div></div>
    </section>
  </section>
</div>

<script type="application/json" id="seed-data">
__SEED_DATA__
</script>

<script>
(function () {
  var seed = JSON.parse(document.getElementById('seed-data').textContent);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US'); }
  function dateStr(s) { if (!s) return '—'; var d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); }
  function sentimentClass(s) { s = (s || '').toLowerCase(); if (s.indexOf('thriv') !== -1) return 'is-thriving'; if (s.indexOf('watch') !== -1 || s.indexOf('declin') !== -1) return 'is-watching'; return ''; }
  function ago(iso) {
    if (!iso) return 'never';
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.round(hrs / 24) + 'd ago';
  }

  // ---- status bar ----
  document.getElementById('syncs').innerHTML = [
    ['BOB', seed.lastSynced.salesforce], ['MEETINGS', seed.lastSynced.meetings], ['TODOS', seed.lastSynced.eodTodo]
  ].map(function (p) { return '<span class="sync-chip">' + p[0] + ' <b>synced ' + ago(p[1]) + '</b></span>'; }).join('');

  // ---- KPIs ----
  var accounts = seed.accounts || [];
  var totalArr = accounts.reduce(function (s, a) { return s + (a.arrActive || 0); }, 0);
  var in90 = Date.now() + 90 * 86400000;
  var renewals90 = accounts.filter(function (a) { return a.renewalDate && new Date(a.renewalDate).getTime() <= in90; }).length;
  var openRisk = accounts.filter(function (a) { return (a.risk || '').match(/^[12]\./); }).length;
  var openTodos = (seed.tasks || []).filter(function (t) { return !t.done; }).length;
  document.getElementById('kpis').innerHTML = [
    ['Total ARR', money(totalArr)], ['Renewals ≤ 90d', renewals90], ['Open risk', openRisk], ['Open todos', openTodos]
  ].map(function (p) { return '<div class="kpi"><span class="mono-label">' + p[0] + '</span><span class="value tabular">' + p[1] + '</span></div>'; }).join('');

  // ---- Book of Business table ----
  document.getElementById('bob-rows').innerHTML = accounts
    .slice().sort(function (a, b) { return (a.accountName || '').localeCompare(b.accountName || ''); })
    .map(function (a) {
      return '<tr>' +
        '<td class="account-name">' + esc(a.accountName) + '</td>' +
        '<td class="tabular">' + money(a.arrActive) + '</td>' +
        '<td class="tabular">' + dateStr(a.renewalDate) + '</td>' +
        '<td><span class="chip ' + sentimentClass(a.csmSentiment) + '">' + esc(a.csmSentiment || '—') + '</span></td>' +
        '<td><span class="chip">' + esc(a.risk || '—') + '</span></td>' +
        '</tr>';
    }).join('');

  // ---- Calendar: current work week, Mon-Fri ----
  var byAccountId = {};
  accounts.forEach(function (a) { byAccountId[a.accountId] = a; });
  var today = new Date();
  var dow = today.getDay(); // 0=Sun
  var monday = new Date(today); monday.setDate(today.getDate() - ((dow + 6) % 7));
  var days = [];
  for (var i = 0; i < 5; i++) { var d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
  var meetings = seed.meetings || {};
  document.getElementById('week-grid').innerHTML = days.map(function (d) {
    var key = d.toISOString().slice(0, 10);
    var label = d.toLocaleDateString('en-US', { weekday: 'short' });
    var dateLabel = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var dayMeetings = meetings[key] || {};
    var cards = Object.keys(dayMeetings).map(function (acctId) {
      var m = dayMeetings[acctId];
      var acctName = (byAccountId[acctId] || {}).accountName || 'Unlinked';
      return '<div class="meeting-card"><div class="meeting-meta">' + esc(acctName) + '</div>' +
        '<p class="meeting-brief">' + esc(m.brief) + '</p>' +
        '<div class="note-field" tabindex="0">' + (m.notes ? esc(m.notes) : '+ add note') + '</div></div>';
    }).join('') || '<div class="day-empty">No meetings scheduled</div>';
    return '<div class="day-col"><div class="day-head"><b>' + label + '</b> · ' + dateLabel + '</div>' + cards + '</div>';
  }).join('');

  // ---- To Dos: Kanban from dueDate/done ----
  var tasks = (seed.tasks || []).filter(function (t) { return !!t; });
  var todayStr = today.toISOString().slice(0, 10);
  function bucket(t) {
    if (t.done) return 'Done';
    if (!t.dueDate) return 'This Week';
    if (t.dueDate < todayStr) return 'Overdue';
    if (t.dueDate === todayStr) return 'Today';
    return 'This Week';
  }
  var cols = { 'Overdue': [], 'Today': [], 'This Week': [], 'Done': [] };
  tasks.forEach(function (t) { cols[bucket(t)].push(t); });
  document.getElementById('kanban').innerHTML = Object.keys(cols).map(function (name) {
    var items = cols[name];
    var cards = items.map(function (t) {
      return '<div class="kanban-card' + (t.done ? ' is-done' : '') + '"><span class="todo-text">' + esc(t.text) + '</span>' +
        (t.badge ? '<span class="badge">' + esc(t.badge) + '</span>' : '') + '</div>';
    }).join('') || '<div class="empty-note">Nothing here</div>';
    var overdueClass = name === 'Overdue' ? ' is-overdue' : '';
    return '<div class="kanban-col' + overdueClass + '"><div class="kanban-head">' + name + ' <span class="count">' + items.length + '</span></div>' + cards + '</div>';
  }).join('');

  // ---- tabs ----
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) {
        t.setAttribute('aria-selected', 'false'); t.tabIndex = -1;
        var p = document.getElementById(t.getAttribute('aria-controls'));
        p.hidden = true; p.classList.remove('is-active');
      });
      tab.setAttribute('aria-selected', 'true'); tab.tabIndex = 0;
      var panel = document.getElementById(tab.getAttribute('aria-controls'));
      panel.hidden = false; panel.classList.add('is-active');
    });
    tab.addEventListener('keydown', function (e) {
      var list = Array.prototype.slice.call(tabs), i = list.indexOf(tab);
      if (e.key === 'ArrowRight') { e.preventDefault(); list[(i + 1) % list.length].focus(); list[(i + 1) % list.length].click(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); list[(i - 1 + list.length) % list.length].click(); }
    });
  });
})();
</script>

</body>
</html>
